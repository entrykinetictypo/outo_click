<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>드래그 영역 오토클릭</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="heading">
      <div class="symbol">▣</div>
      <div>
        <h1>드래그 영역 오토클릭</h1>
        <p>영역을 그리면 그 안을 클릭합니다.</p>
      </div>
    </div>

    <section class="settings">
      <label for="cps">초당 클릭 횟수</label>
      <div class="field-row">
        <input id="cps" type="number" min="1" max="30" step="1" value="5">
        <span class="unit">회 / 초</span>
      </div>

      <label for="mode">클릭 위치</label>
      <select id="mode">
        <option value="random">선택 영역 안의 임의 위치</option>
        <option value="center">선택 영역의 중앙</option>
      </select>

      <label for="limit">클릭 횟수 제한</label>
      <div class="field-row">
        <input id="limit" type="number" min="0" max="100000" step="1" value="0">
        <span class="unit">0 = 무제한</span>
      </div>
    </section>

    <button id="select" class="button primary">✛ 드래그로 클릭 범위 지정</button>
    <div class="secondary-row">
      <button id="start" class="button secondary">▶ 다시 시작</button>
      <button id="stop" class="button danger">■ 정지</button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite">상태 확인 중...</div>
    <p class="note">범위 선택 후 자동으로 시작합니다. 웹페이지의 <strong>Esc</strong> 키나 화면의 <strong>정지</strong> 버튼으로 종료할 수 있습니다.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
